<!DOCTYPE html>
<html lang="en">

<head>
    <title>CSS Color Formats</title>

    <style>
        .box1 {
            color: red;
        }

        .box2 {
            color: #ff0000;
        }

        .box3 {
            color: rgb(255, 0, 0);
        }

        .box4 {
            color: rgba(255, 0, 0, 1);
        }
    </style>
</head>

<body>

    <h1>CSS Color Formats</h1>

    <div class="box1">
        <h2>Color Name</h2>
        <p>This text uses the color name red.</p>
    </div>

    <div class="box2">
        <h2>HEX Color</h2>
        <p>This text uses #ff0000.</p>
    </div>

    <div class="box3">
        <h2>RGB Color</h2>
        <p>This text uses rgb(255, 0, 0).</p>
    </div>

    <div class="box4">
        <h2>RGBA Color</h2>
        <p>This text uses rgba(255, 0, 0, 1).</p>
    </div>

</body>
</html>
